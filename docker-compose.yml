services:
  webobsidian:
    build: .
    image: webobsidian:latest
    container_name: webobsidian
    restart: unless-stopped
    ports:
      # ${HTTP_PORT:-8787} on the host → 8787 in the container.
      # Set HTTP_BIND=127.0.0.1 in .env to expose only to localhost (reverse proxy).
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-8787}:8787"
    environment:
      # Set an initial password (otherwise set it on first-run in the UI)
      WEBOBSIDIAN_PASSWORD: ${WEBOBSIDIAN_PASSWORD:-}
      # File-watch mode: auto (native + polling fallback) | polling. See .env.example.
      WEBOBSIDIAN_WATCH: ${WEBOBSIDIAN_WATCH:-auto}
      # Proxy trust. Default "true" (trust immediate hop) so X-Forwarded-Proto
      # HTTPS cookie detection works behind a reverse proxy. Not a rate-limit risk
      # (limiter keys on the TCP socket addr, not X-Forwarded-For). Set "false" only
      # for a directly-exposed instance with no proxy. See .env.example.
      TRUST_PROXY: ${TRUST_PROXY:-true}
      # --- Vault stored in a GitHub repository (optional; see .env.example) -------
      # Any variable set here overrides settings.json and locks that field in the UI.
      # Leave them all empty to keep using the local /vault folder.
      WEBOBSIDIAN_GITHUB_REPO: ${WEBOBSIDIAN_GITHUB_REPO:-}
      WEBOBSIDIAN_GITHUB_TOKEN: ${WEBOBSIDIAN_GITHUB_TOKEN:-}
      WEBOBSIDIAN_STORAGE: ${WEBOBSIDIAN_STORAGE:-}
      WEBOBSIDIAN_GITHUB_BRANCH: ${WEBOBSIDIAN_GITHUB_BRANCH:-}
      WEBOBSIDIAN_GITHUB_BASE_PATH: ${WEBOBSIDIAN_GITHUB_BASE_PATH:-}
      WEBOBSIDIAN_GITHUB_API_URL: ${WEBOBSIDIAN_GITHUB_API_URL:-}
      WEBOBSIDIAN_GITHUB_FLUSH_SEC: ${WEBOBSIDIAN_GITHUB_FLUSH_SEC:-}
      WEBOBSIDIAN_GITHUB_POLL_SEC: ${WEBOBSIDIAN_GITHUB_POLL_SEC:-}
      WEBOBSIDIAN_STORAGE_PRESET: ${WEBOBSIDIAN_STORAGE_PRESET:-}
      WEBOBSIDIAN_STORAGE_RULES: ${WEBOBSIDIAN_STORAGE_RULES:-}
      WEBOBSIDIAN_CACHE: ${WEBOBSIDIAN_CACHE:-}
      WEBOBSIDIAN_CACHE_DIR: ${WEBOBSIDIAN_CACHE_DIR:-}
      WEBOBSIDIAN_CACHE_MAX_MB: ${WEBOBSIDIAN_CACHE_MAX_MB:-}
      WEBOBSIDIAN_GIT_AUTHOR_NAME: ${WEBOBSIDIAN_GIT_AUTHOR_NAME:-}
      WEBOBSIDIAN_GIT_AUTHOR_EMAIL: ${WEBOBSIDIAN_GIT_AUTHOR_EMAIL:-}
      VAULT_PATH: /vault
      DATA_DIR: /data
      ALLOWED_ROOTS: /vault
      NODE_ENV: production
    volumes:
      # Your vault on the host (VAULT_HOST_PATH in .env) → /vault in the container.
      # Defaults to the bundled sample vault so `docker compose up` works immediately.
      - ${VAULT_HOST_PATH:-./sample-vault}:/vault
      # Persisted settings.json + search index
      - webobsidian-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # Allow time for the initial vault index on first boot (large vaults).
      start_period: 90s

volumes:
  webobsidian-data:
